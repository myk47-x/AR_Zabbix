name: ar_zabbix

services:

  zabbix_server:

    image: zabbix/zabbix-server-pgsql:7.4.10-alpine
    restart: unless-stopped

#    read_only: true

 #   security_opt:
 #     - no-new-privileges

#    cap_drop:
#      - ALL

#    cap_add:
#      -

    tmpfs:
      - /tmp:mode=1777
      - /run

    environment:
      TZ: America/Sao_Paulo
      DB_SERVER_HOST: zabbix_database
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

      ZBX_STARTPOLLERS: 3
      ZBX_STARTPREPROCESSORS: 1
      ZBX_STARTDBSYNCERS: 10
      ZBX_STARTTRAPPERS: 1
      ZBX_STARTPOLLERSUNREACHABLE: 1
      ZBX_STARTPINGERS: 2
      ZBX_CACHESIZE: 128M
      ZBX_HISTORYCACHESIZE: 128M
      ZBX_HISTORYINDEXCACHESIZE: 64M
      ZBX_VALUECACHESIZE: 128M
      ZBX_TRENDCACHESIZE: 64M
      ZBX_CACHEUPDATEFREQUENCY: 60
      ZBX_HOUSEKEEPINGFREQUENCY: 1
      ZBX_STARTVMWARECOLLECTORS: 0
      ZBX_STARTODBCPOLLERS: 0


    volumes:

      - ./server_data/alertscripts:/usr/lib/zabbix/alertscripts
      - ./server_data/externalscripts:/usr/lib/zabbix/externalscripts
      - ./server_data/modules:/var/lib/zabbix/modules
      - ./server_data/enc:/var/lib/zabbix/enc
      - ./server_data/ssh_keys:/var/lib/zabbix/ssh_keys
      - ./server_data/ssl/certs:/var/lib/zabbix/ssl/certs
      - ./server_data/ssl/keys:/var/lib/zabbix/ssl/keys
      - ./server_data/ssl/ssl_ca:/var/lib/zabbix/ssl/ssl_ca
      - ./server_data/snmptraps:/var/lib/zabbix/snmptraps
      - ./server_data/mibs:/var/lib/zabbix/mibs
      - ./server_data/export:/var/lib/zabbix/export 

    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10051"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      zabbix_database:
        condition: service_healthy

    cpus: 2.0

    mem_limit: 2g

    pids_limit: 2048

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    networks:
      - backend
  
  zabbix_frontend:

    image: zabbix/zabbix-web-nginx-pgsql:7.4.10-alpine
    restart: unless-stopped

#    read_only: true

    security_opt:
      - no-new-privileges

#    cap_drop:
#      - ALL

 #   cap_add:
 #     -

    tmpfs:
      - /tmp
      - /run

    environment:

      TZ: America/Sao_Paulo
      DB_SERVER_HOST: zabbix_database
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      ZBX_SERVER_HOST: zabbix_server

    ports: 
      - "8080:8080"

    volumes:

      - ./frontend_data/nginx:/etc/ssl/nginx
      - ./frontend_data/certs:/etc/zabbix/web/certs
      - ./frontend_data/enc:/var/lib/zabbix/enc

    cpus: 0.5

    mem_limit: 512m

    pids_limit: 2048

    ulimits:
      nofile:
        soft: 65536
        hard: 65536


    networks:
      - frontend
      - backend

  zabbix_agent:

    image: zabbix/zabbix-agent:7.4.10-alpine
    restart: unless-stopped

#    read_only: true

    security_opt:
      - no-new-privileges

#    cap_drop:
#      - ALL

#    cap_add:
#      -

    tmpfs:
      - /tmp
      - /run

    environment:

      TZ: America/Sao_Paulo
      ZBX_SERVER_HOST: zabbix_server
      ZBX_PASSIVE_ALLOW: true
      ZBX_HOSTNAME: zabbix_agent

#    volumes:

    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "10050"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    cpus: 0.25

    mem_limit: 256m

    pids_limit: 2048

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    networks:
      - backend

  zabbix_database:

    image: timescale/timescaledb:2.26.4-pg18
    restart: unless-stopped
    user: 999:999

#    read_only: true

    security_opt:
      - no-new-privileges

#    cap_drop:
#      - ALL

#    cap_add:
#      -

    tmpfs:
      - /tmp:mode=1777
      - /run:uid=999,gid=999,mode=700

    environment:

      TZ: America/Sao_Paulo 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - ./postgres_data:/var/lib/postgresql
      - ./init_db:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

    cpus: 2.0

    mem_limit: 4g

    pids_limit: 2048

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    shm_size: 1g

    networks:
      - backend

  zabbix_grafana:

    image: grafana/grafana:13.0.1-security-01-ubuntu
    restart: unless-stopped

#    read_only: true

 #   security_opt:
 #     - no-new-privileges

#    cap_drop:
#      - ALL

#    cap_add:
#      -

    tmpfs:
      - /tmp
      - /run:uid=472,gid=472,mode=1777

    environment:
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app
      TZ: America/Sao_Paulo

    ports:
      - "3000:3000"

    volumes:
      - ./grafana_data/grafana:/var/lib/grafana
      - ./grafana_data/provisioning:/etc/grafana/provisioning

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s


    cpus: 0.5

    mem_limit: 512m

    pids_limit: 2048

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

    networks:
      - backend
      - frontend


networks:

  frontend:

  backend:
    internal: true
