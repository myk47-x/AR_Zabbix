services:
  nginx:
    image: nginxinc/nginx-unprivileged:alpine3.23-perl

    deploy:
      mode: replicated
      replicas: 1

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s

      resources:
        reservations:
          cpus: "0.10"
          memory: 100M

        limits:
          cpus: "1.0"
          memory: 1G
          pids: 200

    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx

    cap_drop:
      - ALL

    ports:
      - "80:8080"
      - "443:8443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

    networks:
      - frontend
      - backend

  metabase:
    image: metabase/metabase:v0.58.14.x

    deploy:
      mode: replicated
      replicas: 1

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s

      resources:
        reservations:
          cpus: "0.10"
          memory: 100M

        limits:
          cpus: "1.0"
          memory: 4G
          pids: 1000 


    tmpfs:
      - /tmp:rw

    user: "1000:1000"

    cap_drop:
      - ALL

    environment:
      MB_PASSWORD_COMPLEXITY: "strong"
      MB_SESSION_TIMEOUT: '{"amount":25,"unit":"minutes"}'
      MAX_SESSION_AGE: 500
      MB_SESSION_COOKIES: "true"
      MB_AUDIT_MAX_RETENTION_DAYS: 0
      MB_ENABLE_PUBLIC_SHARING: "false"
      MB_LOAD_SAMPLE_CONTENT: "false"
      MB_DB_TYPE: "postgres"
      MB_DB_DBNAME_FILE: /run/secrets/postgres_db
      MB_DB_PORT: 5432
      MB_DB_USER_FILE: /run/secrets/postgres_db
      MB_DB_PASS_FILE: /run/secrets/postgres_password
      MB_DB_HOST: "postgres"
      MB_ENCRYPTION_SECRET_KEY: /run/secrets/metabase_encryption


    volumes:
      - ./databases/metabase_sqlite_db:/data

    networks:
      - backend

    secrets:
      - postgres_db
      - postgres_password

  postgres:
    image: postgres:16

    deploy:
      mode: replicated
      replicas: 1

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s

      resources:
        reservations:
          cpus: "0.10"
          memory: "100M"

        limits:
          cpus: "1.0"
          memory: 4G
          pids: 1000

    user: "999:999"

    cap_drop:
      - ALL

    environment:
      POSTGRES_DB_FILE: /run/secrets/postgres_db
      POSTGRES_USER_FILE: /run/secrets/postgres_db
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

    volumes:
      - ./databases/metabase_internal_db:/var/lib/postgresql/data

    networks:
      - backend

    secrets:
      - postgres_db
      - postgres_password

  postgrespn:
    image: postgres:16

    deploy:
      mode: replicated
      replicas: 1

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 10
        window: 120s

      resources:
        reservations:
          cpus: "0.10"
          memory: "100M"

        limits:
          cpus: "1.0"
          memory: 4G
          pids: 1000

    user: "999:999"

#    cap_drop:
#      - ALL

    environment:
      POSTGRES_DB: postgrespn
      POSTGRES_USER: postgrespn
      POSTGRES_PASSWORD: postgrespn

    volumes:
      - ./databases/metabase_qas_db:/var/lib/postgresql/data

    networks:
      - backend

networks:
  backend:
    driver: overlay
    internal: true

  frontend:
    driver: overlay

secrets:
  postgres_db:
    external: true

  postgres_password:
    external: true

  metabase_encryption:
    external: true

